<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта магнитометрической косы</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #f8f9fa; }
        #map { height: 100vh; width: 100%; }
        
        /* 🎯 Легенда (справа, сверху) */
        #legend {
            position: absolute; top: 15px; right: 15px;
            background: rgba(255,255,255,0.98); padding: 12px 16px;
            border-radius: 8px; box-shadow: 0 3px 14px rgba(0,0,0,0.2);
            z-index: 1000; 
            width: 240px; /* Фиксированная ширина для выравнивания */
            font-size: 12px;
        }
        #legend h3 { margin: 0 0 10px 0; font-size: 13px; color: #333; font-weight: 600; border-bottom: 1px solid #eee; padding-bottom: 6px; }
        .legend-item { display: flex; align-items: center; margin: 7px 0; }
        .legend-color {
            width: 20px; height: 20px; margin-right: 10px;
            border-radius: 50%; display: inline-block; flex-shrink: 0;
            border: 2px solid rgba(0,0,0,0.1);
        }
        .legend-line {
            width: 20px; height: 3px; margin-right: 10px;
            display: inline-block; flex-shrink: 0;
        }
        .legend-label { color: #444; }
        
        /* 📋 Панель информации (справа, снизу) */
        #info {
            position: absolute; 
            bottom: 35px; /* Отступ снизу, чтобы не перекрыть Attribution Leaflet */
            right: 15px;
            background: rgba(255,255,255,0.98); padding: 12px 16px;
            border-radius: 8px; box-shadow: 0 3px 14px rgba(0,0,0,0.2);
            z-index: 1000; 
            width: 240px; /* Та же ширина, что у легенды */
            font-size: 13px;
        }
        #info h2 { margin: 0 0 10px 0; font-size: 15px; color: #222; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .info-row { display: flex; justify-content: space-between; margin: 5px 0; }
        .info-label { font-weight: 600; color: #555; }
        .info-value { color: #0066cc; font-family: monospace; font-size: 12px; }
        
        /* Кнопка Пауза/Старт */
        #toggle-btn {
            width: 100%;
            margin-top: 10px;
            padding: 8px 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        #toggle-btn:hover { background: #0056b3; }
        #toggle-btn.paused { background: #28a745; }
        #toggle-btn.paused:hover { background: #218838; }
        
        /* Статус */
        #status {
            padding: 6px 12px; border-radius: 5px; margin-top: 10px;
            font-size: 12px; font-weight: 500; text-align: center;
        }
        .status-ok { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .status-wait { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        .status-paused { background: #e2e3e5; color: #383d41; border: 1px solid #d6d8db; }
        
        /* Поп-апы */
        .sensor-popup { font-size: 11px; line-height: 1.4; }
        .sensor-popup b { color: #3388ff; font-size: 12px; }
    </style>
</head>
<body>
    <!-- 🎯 Легенда (справа, сверху) -->
    <div id="legend">
        <h3>🗂️ Условные обозначения</h3>
        <div class="legend-item">
            <span class="legend-color" style="background:#ff4444; border-color:#cc0000;"></span>
            <span class="legend-label">GPS-антенна (база)</span>
        </div>
        <div class="legend-item">
            <span class="legend-color" style="background:#3388ff; border-color:#0066cc;"></span>
            <span class="legend-label">Датчики S1–S4</span>
        </div>
        <div class="legend-item">
            <span class="legend-line" style="background:#ff8800; border:1px dashed #cc6600;"></span>
            <span class="legend-label">Линия косы (перпендикуляр курсу)</span>
        </div>
        <div class="legend-item">
            <span class="legend-line" style="background:#00cc00;"></span>
            <span class="legend-label">Направление движения</span>
        </div>
        <div class="legend-item">
            <span class="legend-line" style="background:#9933ff; opacity:0.6;"></span>
            <span class="legend-label">Трекинг (последние 100 точек)</span>
        </div>
    </div>

    <!-- 📋 Информация (справа, снизу) -->
    <div id="info">
        <h2>📋 Магнитометрическая коса</h2>
        <div class="info-row"><span class="info-label">📍 GPS:</span><span class="info-value" id="gps-coords">Загрузка...</span></div>
        <div class="info-row"><span class="info-label">🧭 Азимут:</span><span class="info-value" id="azimuth">-</span></div>
        <div class="info-row"><span class="info-label">📏 Вынос:</span><span class="info-value" id="offset">-</span></div>
        <div class="info-row"><span class="info-label">📐 Шаг:</span><span class="info-value" id="spacing">-</span></div>
        <div class="info-row"><span class="info-label">⏱️ Обновлено:</span><span class="info-value" id="last-update">-</span></div>
        <div id="status" class="status-wait">Подключение...</div>
        
        <!-- 🔘 Кнопка Пауза/Старт -->
        <button id="toggle-btn" onclick="toggleAutoPan()">
            <span id="toggle-icon">⏸️</span>
            <span id="toggle-text">Пауза</span>
        </button>
    </div>

    <div id="map"></div>

    <script>
        // 🗺️ Инициализация карты с CartoDB
        const map = L.map('map', { zoomControl: true, minZoom: 18, maxZoom: 23 });
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap © CartoDB',
            subdomains: 'abcd',
            maxZoom: 23
        }).addTo(map);

        // Состояние авто-панорамирования
        let autoPanEnabled = true;
        
        // Объекты карты
        let gpsMarker = null, sensorMarkers = [], sensorLine = null, courseArrow = null, trackLine = null;
        const trackPoints = [];

        // 🔘 Переключение Пауза/Старт
        function toggleAutoPan() {
            autoPanEnabled = !autoPanEnabled;
            const btn = document.getElementById('toggle-btn');
            const icon = document.getElementById('toggle-icon');
            const text = document.getElementById('toggle-text');
            const status = document.getElementById('status');
            
            if (autoPanEnabled) {
                btn.classList.remove('paused');
                icon.textContent = '⏸️';
                text.textContent = 'Пауза';
                status.className = 'status-ok';
                status.textContent = '▶️ Авто-панорамирование включено';
                if (gpsMarker) {
                    map.setView(gpsMarker.getLatLng(), Math.max(20, map.getZoom()));
                }
            } else {
                btn.classList.add('paused');
                icon.textContent = '▶️';
                text.textContent = 'Старт';
                status.className = 'status-paused';
                status.textContent = '⏸️ Пауза: масштаб и позиция фиксированы';
            }
        }

        // Загрузка последней записи
        async function loadLastRecord() {
            try {
                const response = await fetch('field_data.jsonl?t=' + Date.now(), { cache: 'no-store' });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                
                const text = await response.text();
                const lines = text.trim().split('\n').filter(l => l.trim());
                if (!lines.length) throw new Error('Пустой файл');
                
                const data = JSON.parse(lines[lines.length - 1]);
                updateMap(data);
                updateStatus('ok', '✓ ' + new Date().toLocaleTimeString());
            } catch (e) {
                console.warn('⚠️ Ошибка:', e.message);
                updateStatus('error', '✗ ' + e.message);
            }
        }

        // Обновление карты
        function updateMap(data) {
            if (!data?.valid || !data.gps?.latitude) return;
            const { latitude: lat, longitude: lon, azimuth_true: az } = data.gps;

            // GPS маркер
            if (gpsMarker) {
                gpsMarker.setLatLng([lat, lon]);
            } else {
                gpsMarker = L.circleMarker([lat, lon], {
                    radius: 10, color: '#ff4444', fillColor: '#ff6666',
                    fillOpacity: 0.9, weight: 3
                }).addTo(map).bindPopup('<b>📍 GPS-антенна</b>');
            }

            // Датчики
            sensorMarkers.forEach(m => map.removeLayer(m));
            sensorMarkers = [];
            const coords = [];

            data.sensors?.forEach(s => {
                if (s?.latitude) {
                    const m = L.circleMarker([s.latitude, s.longitude], {
                        radius: 8, color: '#3388ff', fillColor: '#66aaff',
                        fillOpacity: 0.85, weight: 2
                    }).addTo(map);
                    m.bindPopup(`<div class="sensor-popup"><b>🔌 S${s.id}</b><br>${s.latitude.toFixed(7)}, ${s.longitude.toFixed(7)}<br>📊 ${s.amplitude_nt?.toFixed(1) || 'N/A'} нТл</div>`);
                    sensorMarkers.push(m);
                    coords.push([s.latitude, s.longitude]);
                }
            });

            // Линия косы
            if (sensorLine) map.removeLayer(sensorLine);
            if (coords.length > 1) {
                sensorLine = L.polyline(coords, {
                    color: '#ff8800', weight: 4, opacity: 0.9, dashArray: '12, 8'
                }).addTo(map);
            }

            // Стрелка курса
            if (courseArrow) map.removeLayer(courseArrow);
            const len = 0.00008;
            const endLat = lat + len * Math.cos(az * Math.PI / 180);
            const endLon = lon + len * Math.sin(az * Math.PI / 180);
            courseArrow = L.polyline([[lat, lon], [endLat, endLon]], {
                color: '#00cc00', weight: 3, opacity: 0.85
            }).addTo(map);

            // Трек
            trackPoints.push([lat, lon]);
            if (trackPoints.length > 100) trackPoints.shift();
            if (trackLine) map.removeLayer(trackLine);
            if (trackPoints.length > 1) {
                trackLine = L.polyline(trackPoints, {
                    color: '#9933ff', weight: 2, opacity: 0.5
                }).addTo(map);
            }

            // Обновление интерфейса
            document.getElementById('gps-coords').textContent = `${lat.toFixed(5)}°, ${lon.toFixed(5)}°`;
            document.getElementById('azimuth').textContent = `${az?.toFixed(1) || '-'}°`;
            document.getElementById('offset').textContent = data.geometry_params?.['1']?.dx ? `${data.geometry_params['1'].dx} м` : '-';
            document.getElementById('spacing').textContent = data.geometry_params?.['1']?.dy ? `${(Math.abs(data.geometry_params['1'].dy)*2).toFixed(1)} м` : '-';
            document.getElementById('last-update').textContent = new Date(data.timestamp_utc * 1000).toLocaleTimeString();

            // 🔑 Автоцентрирование только если включено
            if (autoPanEnabled) {
                const bounds = L.latLngBounds([[lat, lon], ...coords]);
                map.fitBounds(bounds.pad(0.25), { maxZoom: 22, animate: true });
            }
        }

        function updateStatus(type, msg) {
            const el = document.getElementById('status');
            if (!autoPanEnabled && type !== 'error') return;
            el.className = `status-${type}`;
            el.textContent = msg;
        }

        // Автообновление
        loadLastRecord();
        setInterval(loadLastRecord, 1500);

        map.on('error', (e) => console.error('Map error:', e));
    </script>
</body>
</html>
